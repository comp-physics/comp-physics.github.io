# Pages shown in navbar
nav_pages:
  - name: team
  - name: research
  - name: papers
  - name: teaching
  - name: software
    display: MFC
  # - name: hardware

include:
  - .htaccess
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge

# Only emit assets/main.css.map for local builds. In production it was a 430 KB
# file -- larger than the CSS itself -- embedding the full text of every Sass
# source via sourcesContent. CI sets JEKYLL_ENV=production; a bare `jekyll build`
# or `jekyll serve` defaults to development, so local debugging is unaffected.
sass:
  sourcemap: development
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links


plugins:
  - jekyll-scholar

scholar:

  last_name: Bryngelson
  first_name: [Spencer H.]

  style: shb
  locale: en

  source: cv/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending

  replace_strings: true
  join_strings: true

  query: "@*"

  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - tags
  - LICENSE
  - .DS_Store
  - script

  # LaTeX build artifacts in cv/. These are gitignored, so they exist only on a
  # local machine and would otherwise be copied into _site and served publicly.
  - cv/*.aux
  - cv/*.bbl
  - cv/*.blg
  - cv/*.fdb_latexmk
  - cv/*.fls
  - cv/*.log
  - cv/*.out
  - cv/*.run.xml
  - cv/*.synctex.gz
  - cv/*.toc
  - cv/*-blx.bib
